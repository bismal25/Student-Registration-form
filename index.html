<!DOCTYPE html>
<html>
<head>
    <title>Registration form for students</title>
</head>
<body>
    <h1>Student Registration form</h1>
    <form>
        <label>Full Name:</label>
        <input type="text" placeholder="Enter your name">
        <br><br>

        <label>Email:</label>
        <input type="email" placeholder="youremail@gmail.com">
        <br><br>

        <label>Password:</label>
        <input type="password" placeholder="strong password using symbols, numbers, letters">
        <br><br>

        <label>Contact:</label>
        <input type="tel" placeholder="03xxxxxxxxx">
        <br><br>

        <label>Age:</label>
        <input type="number" placeholder="write your exact Age">
        <br><br>

        <label>Date of Birth:</label>
        <input type="date">
        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female
        <br><br>

        <label>Hobbies</label>
        <input type="checkbox"> sleeping
        <input type="checkbox"> coding
        <input type="checkbox"> Workout
        <input type="checkbox"> reading
        <input type="checkbox"> painting
        <input type="checkbox"> cooking
        <br><br>

        <label>Country:</label>
        <select>
            <option>Pakistan</option>
            <option>India</option>
            <option>China</option>
            <option>United States</option>
        </select>
        <br><br>

        <label>About Yourself:</label>
        <br>
        <textarea rows="5" cols="30" placeholder="Write something about yourself"></textarea>
        <br><br>

        <label>Upload Your Picture:</label>
        <input type="file">
        <br><br>

        <button type="submit">Submit</button>
        <button type="reset">Reset</button>
    </form>
</body>
</html>
